appId: io.fpl0.oak
productName: Oak
copyright: Copyright © 2026 Filipe Lima
directories:
  output: release
  buildResources: build
files:
  - main.cjs
  - splash.html
  - package.json
  - "!**/node_modules/**"
# The shell has no dependencies; don't let the builder walk up to the repository's bun workspace.
npmRebuild: false
afterPack: scripts/after-pack.cjs
# The Bun binary sits outside the asar; the runtime tree (server, content, built app, sound pack,
# production node_modules) is copied by scripts/after-pack.cjs. Bun reads both as real files.
extraResources:
  - from: stage/bin
    to: bin
asar: true
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.png
  artifactName: Oak-macos-${arch}.${ext}
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  minimumSystemVersion: "13.0"
  extendInfo:
    NSMicrophoneUsageDescription: Oak listens when you sing, so it can grade your pitch.
dmg:
  title: Oak
